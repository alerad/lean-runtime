site_name: Lean Runtime
site_description: Run Lean files and Lake projects in exact, recorded environments
site_url: https://alerad.github.io/lean-runtime/
repo_url: https://github.com/alerad/lean-runtime
repo_name: alerad/lean-runtime
copyright: Copyright © Alejandro Radisic

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    scheme: default
    primary: custom
    accent: custom

nav:
  - Home: index.md
  - Start here: tutorial.md
  - Workflows:
      - Check Lean files: workflows/check-files.md
      - Work with Lake projects: workflows/lake-projects.md
  - Concepts:
      - Context selection: concepts/context-selection.md
  - Reference:
      - Commands: reference/commands.md
      - Python API: reference/python-api.md
  - Trust and limitations: trust.md

plugins:
  - search

extra_css:
  - stylesheets/site.css

extra_javascript:
  - javascripts/run-inspector.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alerad/lean-runtime
      name: Lean Runtime on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

strict: true
