site_name: Lean Runtime
site_description: Exact, reusable environments for Lean projects
site_url: https://alerad.github.io/lean-runtime/
repo_url: https://github.com/alerad/lean-runtime
repo_name: alerad/lean-runtime
copyright: Copyright © Alejandro Radisic

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Guides:
      - Standalone Lean files: standalone-files.md
      - Environments: environments.md
      - Lake projects and shared dependencies: local-projects.md
      - Portable copies and libraries: portable-copies.md
      - Publishing a Lean project: project-publishing.md
      - Ready-to-run programs: ready-programs.md
      - Python API: python-api.md
      - CLI: cli.md
      - Execution captures: captures.md
      - Verify, compare, profile, and matrix: v1-precision.md
      - V1 release case study: case-study-v1.md
  - Concepts:
      - Architecture: architecture.md
      - Trust and limitations: trust-and-limitations.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

strict: true
