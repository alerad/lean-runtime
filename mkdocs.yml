site_name: Lean Runtime
site_description: Check Lean proofs with one command — exact, reusable environments included
site_url: https://alerad.github.io/lean-runtime/
repo_url: https://github.com/alerad/lean-runtime
repo_name: alerad/lean-runtime
copyright: Copyright © Alejandro Radisic

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Guides:
      - Check a single file: standalone-files.md
      - Work in a Lake project: local-projects.md
      - Use Lean from Python: python-api.md
  - Sharing:
      - Publish a project: project-publishing.md
      - Portable environments: portable-copies.md
      - Ready-to-run programs: ready-programs.md
  - CLI reference: cli.md
  - Advanced:
      - Verify, compare, and measure: v1-precision.md
      - Environment commands: environments.md
      - Execution captures: captures.md
      - Trust and limitations: trust-and-limitations.md
      - Architecture: architecture.md
      - Lake artifact-cache design: lake-artifact-cache-design.md
  - Project:
      - Release case study: case-study-v1.md
      - Development: development.md

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alerad/lean-runtime
      name: Lean Runtime on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

strict: true
