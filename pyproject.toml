[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-runtime"
version = "4.24.0"
description = "Run Lean 4 proofs from Python or standalone files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'", "zstandard>=0.23,<1"]
license = "Apache-2.0"
authors = [{ name = "Alejandro Radisic" }]
keywords = ["lean4", "theorem-prover", "formal-verification", "toolchain"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "tomli>=2", "jsonschema>=4.23"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/alerad/lean-runtime"
Documentation = "https://alerad.github.io/lean-runtime/"
Repository = "https://github.com/alerad/lean-runtime.git"
Issues = "https://github.com/alerad/lean-runtime/issues"
Changelog = "https://github.com/alerad/lean-runtime/blob/main/CHANGELOG.md"

[project.scripts]
lean-runtime = "lean_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["lean_runtime*"]

[tool.setuptools.package-data]
lean_runtime = ["py.typed"]
"lean_runtime.discovery" = ["py.typed", "data/*.json", "schemas/*.json"]

[tool.setuptools.data-files]
"share/lean-runtime/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: requires Git, network, and a real Lean toolchain"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
