name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[docs]'
      - run: mkdocs build --strict
      - name: Verify the rendered landing page
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("site/index.html").read_text(encoding="utf-8")
          if "Check the proof. Reuse everything else." not in html:
              raise SystemExit("landing-page headline was not rendered")
          if 'class="lr-intro" markdown' in html:
              raise SystemExit("landing-page Markdown was emitted as raw text")
          if 'class="grid cards" markdown' in html:
              raise SystemExit("landing-page cards were emitted as raw text")
          if "Discovering an exact environment" not in html:
              raise SystemExit("landing-page proof demo was not rendered")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
