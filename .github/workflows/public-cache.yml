name: Publish public Lean cache

on:
  workflow_dispatch:
    inputs:
      package-reference:
        description: github:OWNER/REPOSITORY@TAG-OR-COMMIT
        required: true
        type: string
      alias-tag:
        description: Optional human-readable cache tag
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      lock-id: ${{ steps.lock.outputs.lock_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - id: lock
        env:
          PACKAGE_REFERENCE: ${{ inputs.package-reference }}
        run: |
          python - <<'PY'
          import os
          from lean_runtime import Runtime
          lock = Runtime(libraries=[]).prepare_references([os.environ["PACKAGE_REFERENCE"]])
          lock.write("environment.lock.json")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"lock_id={lock.lock_id}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: environment-lock
          path: environment.lock.json

  platform:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: macos-15-intel
            name: macos-amd64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: environment-lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Build and publish platform
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Mathlib source builds need hours; the default 1800s build timeout
          # killed every platform job of the maiden run at exactly 30 minutes.
          # The result file must be uniquely named: finalize downloads every
          # platform artifact into one directory, and identical filenames
          # silently overwrite each other (last write wins), collapsing the
          # published index to a single platform.
          lean-runtime --availability local build-and-publish environment.lock.json \
            --publish-to ghcr.io/alerad/lean-runtime-cache \
            --timeout 18000 \
            --accelerate \
            --platform-only --attest > "platform-result-${{ matrix.name }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.name }}
          path: platform-result-${{ matrix.name }}.json

  finalize:
    needs: [resolve, platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: environment-lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Publish canonical index
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ALIAS_TAG: ${{ inputs.alias-tag }}
        run: |
          args=(finalize-publication "${{ needs.resolve.outputs.lock-id }}" results/*.json \
            --library ghcr.io/alerad/lean-runtime-cache)
          if [[ -n "$ALIAS_TAG" ]]; then args+=(--tag "$ALIAS_TAG"); fi
          lean-runtime "${args[@]}"
      - name: Verify a clean public-cache client
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          acceptance_home="$RUNNER_TEMP/lean-runtime-cache-acceptance"
          lean-runtime --home "$acceptance_home" \
            --library ghcr.io/alerad/lean-runtime-cache \
            --availability required download environment.lock.json --name acceptance
          lean-runtime --home "$acceptance_home" verify acceptance --offline
          # Derive the generated root module name from the code so this smoke
          # test cannot silently drift when the module is renamed.
          python -c "from lean_runtime.lake import ROOT_MODULE; print(f'import {ROOT_MODULE}')" > Main.lean
          lean-runtime --home "$acceptance_home" check acceptance Main.lean
          printf 'import Mathlib\nexample : 2 + 2 = 4 := by norm_num\n' > UserMain.lean
          lean-runtime --home "$acceptance_home" check acceptance UserMain.lean
