name: Publish sparse bundled catalog

on:
  # Merging a catalog update publishes its artifacts, then the catalog itself,
  # so released Runtimes offer the new environment only once it is downloadable.
  push:
    branches: [main]
    paths:
      - "catalog/locks/**"
      - "lean_runtime/discovery/data/catalog.json"
  workflow_dispatch:
    inputs:
      entry:
        description: Catalog lock stem, or "all"
        required: true
        default: all
        type: string
      rebuild:
        description: Build from source even when a remote artifact exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: lean-runtime-catalog-v4
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.entries.outputs.entries }}
      count: ${{ steps.entries.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: entries
        env:
          REQUESTED_ENTRY: ${{ inputs.entry }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import glob, json, os, pathlib, subprocess
          paths = sorted(glob.glob("catalog/locks/*.lock.json"))
          if os.environ["EVENT_NAME"] == "push":
              # Only locks added or changed by this push need new artifacts.
              before = os.environ["BEFORE"]
              if before.strip("0"):
                  changed = subprocess.run(
                      ["git", "diff", "--name-only", "--diff-filter=AM", before, "HEAD",
                       "--", "catalog/locks"],
                      check=True, capture_output=True, text=True,
                  ).stdout.split()
                  paths = [path for path in paths if path in changed]
              requested = None
          else:
              requested = os.environ["REQUESTED_ENTRY"]
          entries = [
              {"id": pathlib.Path(path).name.removesuffix(".lock.json"), "lock": path}
              for path in paths
          ]
          if requested not in {None, "all"}:
              entries = [entry for entry in entries if entry["id"] == requested]
              if not entries:
                  raise SystemExit(f"unknown catalog entry: {requested}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("entries=" + json.dumps(entries, separators=(",", ":")) + "\n")
              output.write(f"count={len(entries)}\n")
          PY

  platform:
    needs: matrix
    if: needs.matrix.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        entry: ${{ fromJson(needs.matrix.outputs.entries) }}
        platform:
          - os: ubuntu-latest
            name: linux-amd64
          - os: macos-15-intel
            name: macos-amd64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Reuse or build the full environment, then publish its sparse successor
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ github.token }}
          ENTRY_ID: ${{ matrix.entry.id }}
          LOCK_PATH: ${{ matrix.entry.lock }}
          LIBRARY: ghcr.io/alerad/lean-runtime-cache
          RESULT_SUFFIX: ${{ matrix.platform.name }}
        run: |
          runtime_home="$RUNNER_TEMP/lean-runtime-$ENTRY_ID"
          toolchain=$(python -c \
            'from lean_runtime import EnvironmentLock; import sys; print(EnvironmentLock.load(sys.argv[1]).toolchain)' \
            "$LOCK_PATH")
          # Publication needs the full toolchain both to inventory/probe the
          # capsule and to derive its independently verified slim successor.
          lean-runtime --home "$runtime_home" toolchain install "$toolchain"
          # Existing entries reuse their downloadable full environment. A new
          # catalog entry has no remote artifact yet, so auto falls back to its
          # exact source lock and creates the publication input in this run.
          # `rebuild` skips remote reuse entirely: an environment restored from
          # check-capsule frames lacks the authoritative import inventories a
          # publication input needs, so repairing a capsule-only lock must
          # build from source.
          if [[ "${{ inputs.rebuild || false }}" == "true" ]]; then
            availability=local
          else
            availability=auto
          fi
          lean-runtime --home "$runtime_home" --availability "$availability" \
            --library "$LIBRARY" env acquire "$LOCK_PATH" --name publisher \
            --timeout 7200 --accelerate
          lean-runtime --home "$runtime_home" --availability local \
            env publish "$LOCK_PATH" --to "$LIBRARY" \
            --platform-only --attest > "environment-$RESULT_SUFFIX.json"
          lean-runtime --home "$runtime_home" toolchain publish "$toolchain" \
            --library "$LIBRARY" > "toolchain-$RESULT_SUFFIX.json"
          # Declaration data is platform-neutral. Generate it on the Linux leg,
          # reusing the full environment already acquired above. Deterministic
          # package shards deduplicate by digest across catalog environments.
          if [[ "$RESULT_SUFFIX" == "linux-amd64" ]]; then
            lean-runtime --home "$runtime_home" --availability local \
              declaration-index build "$LOCK_PATH" --output declaration-shards
            lean-runtime --home "$runtime_home" --availability local \
              declaration-index publish "$LOCK_PATH" \
              declaration-shards/declaration-index-build.json \
              --library "$LIBRARY" --sign > declaration-index.json
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: catalog-${{ matrix.entry.id }}-${{ matrix.platform.name }}
          path: |
            environment-${{ matrix.platform.name }}.json
            toolchain-${{ matrix.platform.name }}.json
            declaration-index.json
          if-no-files-found: error

  finalize:
    needs: [matrix, platform]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        entry: ${{ fromJson(needs.matrix.outputs.entries) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: catalog-${{ matrix.entry.id }}-*
          path: results
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Publish signed indexes only after all platforms succeeded
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ github.token }}
          LOCK_PATH: ${{ matrix.entry.lock }}
          LIBRARY: ghcr.io/alerad/lean-runtime-cache
        run: |
          readarray -t identity < <(python - "$LOCK_PATH" <<'PY'
          from lean_runtime import EnvironmentLock
          import sys
          lock = EnvironmentLock.load(sys.argv[1])
          print(lock.toolchain)
          print(lock.lock_id)
          PY
          )
          lean-runtime toolchain finalize "${identity[0]}" \
            results/toolchain-*.json --library "$LIBRARY" --sign
          lean-runtime env finalize "${identity[1]}" \
            results/environment-*.json --library "$LIBRARY" --sign

  verify:
    if: inputs.entry == 'all'
    needs: finalize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Verify every public v3 artifact anonymously
        run: python scripts/registry_preflight.py

  catalog:
    # Publish the catalog Runtimes fetch at `new`/`update` time. Runs only from
    # main, after any new artifacts finalized, and only when every cataloged
    # environment and toolchain is publicly downloadable.
    needs: [matrix, finalize]
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.matrix.result == 'success'
      && (needs.finalize.result == 'success' || needs.finalize.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Require every cataloged capsule and runtime to be public
        run: python scripts/registry_preflight.py --capsules-only
      - name: Publish the signed catalog
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ github.token }}
          LIBRARY: ghcr.io/alerad/lean-runtime-cache
        run: |
          # The commit time orders publications: re-running an older workflow
          # is refused instead of rolling clients back, and a later commit that
          # removes an entry retracts it.
          lean-runtime catalog publish lean_runtime/discovery/data/catalog.json \
            --to "$LIBRARY" --sequence "$(git log -1 --format=%ct)" --sign --yes
