name: Publish check-only Lean toolchain

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: Lean toolchain, for example leanprover/lean4:v4.33.0
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: macos-15-intel
            name: macos-amd64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Verify and publish platform runtime
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          lean-runtime toolchain-publish "$TOOLCHAIN" \
            --library ghcr.io/alerad/lean-runtime-cache \
            > "toolchain-${{ matrix.name }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ matrix.name }}
          path: toolchain-${{ matrix.name }}.json

  finalize:
    needs: platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: toolchain-*
          path: results
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Publish multi-platform index
        env:
          LEAN_RUNTIME_REGISTRY_USERNAME: ${{ github.actor }}
          LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          lean-runtime toolchain-finalize-publication "$TOOLCHAIN" results/*.json \
            --library ghcr.io/alerad/lean-runtime-cache --sign
