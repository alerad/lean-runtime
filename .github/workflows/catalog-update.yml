name: Catalog update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lean-runtime-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect the newest stable Mathlib release
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/catalog_update.py check >> "$GITHUB_OUTPUT"

      - name: Skip when an update pull request is already open
        id: existing
        if: steps.detect.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRY_ID: ${{ steps.detect.outputs.id }}
        run: |
          open="$(gh pr list --head "catalog/$ENTRY_ID" --state open --json number --jq length)"
          echo "open=$open" >> "$GITHUB_OUTPUT"

      - name: Restore retained sources
        if: steps.detect.outputs.missing == 'true' && steps.existing.outputs.open == '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/lean-runtime/sources
          key: catalog-update-sources-${{ steps.detect.outputs.id }}
          restore-keys: |
            catalog-update-sources-

      - name: Install Lean Runtime
        if: steps.detect.outputs.missing == 'true' && steps.existing.outputs.open == '0'
        run: python -m pip install -e .

      - name: Freeze the lock and rebuild the bundled catalog
        if: steps.detect.outputs.missing == 'true' && steps.existing.outputs.open == '0'
        env:
          ENTRY_TAG: ${{ steps.detect.outputs.tag }}
        run: python scripts/catalog_update.py apply --tag "$ENTRY_TAG"

      - name: Open the update pull request
        if: steps.detect.outputs.missing == 'true' && steps.existing.outputs.open == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRY_ID: ${{ steps.detect.outputs.id }}
          ENTRY_TAG: ${{ steps.detect.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="catalog/$ENTRY_ID"
          git checkout -b "$branch"
          git add catalog lean_runtime/discovery/data/catalog.json
          git commit -m "catalog: add $ENTRY_ID"
          git push --force origin "$branch"
          gh pr create \
            --title "catalog: add $ENTRY_ID" \
            --body "$(printf '%s\n' \
              "Automated catalog update for Mathlib $ENTRY_TAG." \
              "" \
              "- \`catalog/environments.toml\`: new \`$ENTRY_ID\` entry" \
              "- \`catalog/locks/$ENTRY_ID.lock.json\`: exact lock frozen from the release tag" \
              "- \`lean_runtime/discovery/data/catalog.json\`: rebuilt bundled catalog" \
              "" \
              "Review the frozen toolchain and lock digest, then after merging publish the capsules:" \
              "" \
              '```' \
              "gh workflow run publish-catalog-v4.yml -f entry=$ENTRY_ID" \
              '```')"
