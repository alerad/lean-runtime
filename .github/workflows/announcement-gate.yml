name: Announcement gate

# Fail-closed release canary: proves that a clean, UNAUTHENTICATED machine can
# install lean-runtime from PyPI and complete the advertised Mathlib journeys
# using prebuilt downloadable environments only. No registry credentials are
# provided anywhere in this workflow - that is the point.

on:
  workflow_dispatch:
    inputs:
      version:
        description: PyPI version to gate; use "checkout" for this ref (empty = latest)
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requested lean-runtime
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$REQUESTED_VERSION" == "checkout" ]]; then
            python -m pip install .
          else
            python -m pip install --no-cache-dir \
              "lean-runtime${REQUESTED_VERSION:+==$REQUESTED_VERSION}"
          fi
      - name: Registry preflight (anonymous)
        run: python scripts/registry_preflight.py

  gate:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-15
            python: "3.12"
          - os: macos-15-intel
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install requested lean-runtime
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$REQUESTED_VERSION" == "checkout" ]]; then
            python -m pip install .
          else
            python -m pip install --no-cache-dir \
              "lean-runtime${REQUESTED_VERSION:+==$REQUESTED_VERSION}"
          fi
      - name: Run announcement gate
        run: python scripts/announcement_gate.py --report gate-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report-${{ matrix.os }}-py${{ matrix.python }}
          path: gate-report.json

  catalog-consumer:
    if: inputs.version == 'checkout'
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mathlib-v4.33.0
            module: Mathlib
          - id: leancert-v4.30.0.5
            module: LeanCert
          - id: leancert-v4.31.0
            module: LeanCert
          - id: leancert-v4.32.2.4
            module: LeanCert
          - id: leancert-v4.33.0
            module: LeanCert
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Download and check as an anonymous clean consumer
        env:
          CATALOG_ID: ${{ matrix.id }}
          ROOT_MODULE: ${{ matrix.module }}
        run: |
          acceptance_home="$RUNNER_TEMP/lean-runtime-catalog-$CATALOG_ID"
          lock="catalog/locks/$CATALOG_ID.lock.json"
          lean-runtime --home "$acceptance_home" \
            --library ghcr.io/alerad/lean-runtime-cache \
            --availability required env acquire "$lock" --name acceptance --download-only
          lean-runtime --home "$acceptance_home" verify acceptance --offline
          printf 'import %s\n' "$ROOT_MODULE" > UserMain.lean
          if [[ "$ROOT_MODULE" == "Mathlib" ]]; then
            printf 'example : 2 + 2 = 4 := by norm_num\n' >> UserMain.lean
          fi
          lean-runtime --home "$acceptance_home" check UserMain.lean --using env:acceptance
