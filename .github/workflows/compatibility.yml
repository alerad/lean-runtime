name: Ecosystem compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  mathlib:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/lean-runtime
          key: lean-runtime-compat-${{ runner.os }}-${{ hashFiles('compatibility/**') }}
      - run: python -m pip install -e .
      - run: python scripts/run_compatibility.py compatibility/mathlib-4.32.2.json
