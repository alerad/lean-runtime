name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: lean-runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify the immutable release surface
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          if re.search(rf"^## {re.escape(version)} - \d{{4}}-\d{{2}}-\d{{2}}$", changelog, re.M) is None:
              raise SystemExit(f"CHANGELOG has no dated {version} release section")
          PY
      - run: python -m pip install -e '.[dev,docs]' build twine
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict lean_runtime
      - run: pytest
      - run: mkdocs build --strict
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/smoke_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - id: pypi-state
        name: Refuse a conflicting or partially stale PyPI version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.request
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          try:
              with urllib.request.urlopen(
                  f"https://pypi.org/pypi/lean-runtime/{version}/json", timeout=30
              ) as response:
                  remote = {
                      item["filename"]: item["digests"]["sha256"]
                      for item in json.load(response)["urls"]
                  }
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              remote = {}
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in pathlib.Path("dist").iterdir()
              if path.is_file()
          }
          conflicts = {
              name: (digest, remote[name])
              for name, digest in local.items()
              if name in remote and remote[name] != digest
          }
          if conflicts:
              raise SystemExit(f"PyPI already has conflicting release files: {conflicts}")
          complete = bool(local) and all(remote.get(name) == digest for name, digest in local.items())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"complete={'true' if complete else 'false'}\n")
          PY
      - if: steps.pypi-state.outputs.complete != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish GitHub release after PyPI succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## $version - " '
            index($0, heading) == 1 { active=1; next }
            active && /^## / { exit }
            active { print }
          ' CHANGELOG.md > "$notes"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --notes-file "$notes"
          fi
