name: Publish Lean Runtime cache
description: Build a locked Lean environment and publish its OCI cache layers

inputs:
  lock:
    description: Path to environment.lock.json
    required: true
  repository:
    description: OCI repository, for example oci://ghcr.io/owner/project-cache
    required: true
  tag:
    description: Optional human-readable OCI tag
    required: false
    default: ""
  registry-username:
    description: Registry username
    required: true
  registry-password:
    description: Registry token or password
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install Lean Runtime
      shell: bash
      run: python -m pip install "${GITHUB_ACTION_PATH}/../../.."
    - name: Build and publish cache
      shell: bash
      env:
        LEAN_RUNTIME_REGISTRY_USERNAME: ${{ inputs.registry-username }}
        LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ inputs.registry-password }}
      run: |
        args=(build-and-push "${{ inputs.lock }}" --push-to "${{ inputs.repository }}")
        if [[ -n "${{ inputs.tag }}" ]]; then
          args+=(--tag "${{ inputs.tag }}")
        fi
        lean-runtime "${args[@]}"
