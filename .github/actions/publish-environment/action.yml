name: Publish a Lean environment
description: Build an exact Lean environment and publish a ready-to-use copy

inputs:
  lock:
    description: Path to environment.lock.json
    required: true
  library:
    description: Environment library, for example ghcr.io/owner/lean-environments
    required: true
  tag:
    description: Optional human-readable version name
    required: false
    default: ""
  username:
    description: Environment library username
    required: true
  password:
    description: Environment library token or password
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install Lean Runtime
      shell: bash
      run: python -m pip install "${GITHUB_ACTION_PATH}/../../.."
    - name: Build and publish environment
      shell: bash
      env:
        LEAN_RUNTIME_REGISTRY_USERNAME: ${{ inputs.username }}
        LEAN_RUNTIME_REGISTRY_PASSWORD: ${{ inputs.password }}
      run: |
        lean-runtime env publish "${{ inputs.lock }}" \
          --to "${{ inputs.library }}" --platform-only \
          > lean-runtime-environment-platform.json
        toolchain=$(python -c 'from lean_runtime import EnvironmentLock; import sys; print(EnvironmentLock.load(sys.argv[1]).toolchain)' "${{ inputs.lock }}")
        lock_id=$(python -c 'from lean_runtime import EnvironmentLock; import sys; print(EnvironmentLock.load(sys.argv[1]).lock_id)' "${{ inputs.lock }}")
        lean-runtime toolchain publish "$toolchain" --library "${{ inputs.library }}" \
          > lean-runtime-toolchain-platform.json
        lean-runtime toolchain finalize "$toolchain" \
          lean-runtime-toolchain-platform.json --library "${{ inputs.library }}"
        args=(env finalize "$lock_id" lean-runtime-environment-platform.json \
          --library "${{ inputs.library }}")
        if [[ -n "${{ inputs.tag }}" ]]; then args+=(--tag "${{ inputs.tag }}"); fi
        lean-runtime "${args[@]}"
